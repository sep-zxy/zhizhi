name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-refs:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit all fetched branches and tags
        run: |
          $ErrorActionPreference = 'Stop'
          & 'scripts/ci/scan-secrets.ps1' -AllRefs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: audit-credential-scan-redacted
          path: ${{ runner.temp }}/gitleaks-redacted.json
          retention-days: 1
