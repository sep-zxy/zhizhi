name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main push run of Static Checks (includes both packages)
        required: true
        type: string
      version:
        description: Desktop version, without v prefix
        required: true
        default: '0.1.1'
        type: string
      dry_run:
        description: Validate everything without creating or publishing a release
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_BUILD_RUN: ${{ inputs.run_id }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Verify main CI, source ancestry and every artifact
        id: verify
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/ci/verify-release.mjs
          if ($LASTEXITCODE -ne 0) { throw '发布门禁未通过' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: packages/
          retention-days: 1
          if-no-files-found: error
      - name: Record validated source
        env:
          VERIFIED_COMMIT: ${{ steps.verify.outputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          "Verified commit: $env:VERIFIED_COMMIT; dry run: $env:DRY_RUN" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append

  publish:
    if: ${{ !inputs.dry_run }}
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - name: Download packages that passed the release gate
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'verified-release' --dir 'packages'
          if ($LASTEXITCODE -ne 0) { throw '已验证产物下载失败' }
          $commit = (Get-Content -LiteralPath 'packages/source-commit.txt' -Encoding UTF8 -Raw).Trim()
          if ($commit -ne $env:VERIFIED_COMMIT) { throw '发布提交与门禁输出不一致' }
      - name: Publish verified packages
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = $env:VERIFIED_COMMIT
          $tag = 'v' + $env:RELEASE_VERSION
          $notes = @"
          知枝：从代码实践中长出自己的知识。

          源码提交：$commit
          CI 记录：https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:RELEASE_BUILD_RUN

          此版本使用主分支同一次 CI 中已通过密钥扫描、语法类型检查、工作流与发布门禁验证、Windows/macOS 打包和启动检查的产物。发布前再次验证源码已进入 main、运行编号、运行次数、版本、平台及 SHA256；发布阶段不重新构建。

          macOS 使用临时签名，尚未公证；Windows 尚未配置代码签名。未进行页面视觉验收。
          "@
          Set-Content -LiteralPath 'packages/release-notes.md' -Value $notes -Encoding UTF8
          function Get-OptionalGitHubResource([string]$ApiPath) {
              $response = gh api $ApiPath 2>&1
              if ($LASTEXITCODE -eq 0) { return (($response -join "`n") | ConvertFrom-Json) }
              if (($response -join "`n") -match '\(HTTP 404\)') { return $null }
              throw '无法确认 GitHub 现有标签或版本状态，拒绝发布'
          }
          $tagLookup = Get-OptionalGitHubResource "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
          if ($tagLookup) {
              $target = $tagLookup.object
              for ($depth = 0; $target.type -eq 'tag' -and $depth -lt 10; $depth++) {
                  $annotated = Get-OptionalGitHubResource "repos/$env:GITHUB_REPOSITORY/git/tags/$($target.sha)"
                  if (-not $annotated) { throw '无法解析已有标签' }
                  $target = $annotated.object
              }
              if ($target.type -ne 'commit' -or $target.sha -ne $commit) { throw '已有标签指向其他提交，拒绝发布' }
          }
          $existing = Get-OptionalGitHubResource "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          if ($existing) {
              if (-not $existing.draft -or $existing.target_commitish -ne $commit) { throw '不覆盖已发布版本或其他提交的草稿' }
          } else {
              gh release create $tag --repo $env:GITHUB_REPOSITORY --target $commit --draft --title ('知枝 ' + $tag) --notes-file 'packages/release-notes.md'
              if ($LASTEXITCODE -ne 0) { throw '发布草稿创建失败' }
          }
          $assets = @(Get-ChildItem -LiteralPath 'packages/windows-x64', 'packages/macos-arm64' -File | Where-Object Extension -In '.exe', '.dmg' | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw '安装包数量不正确' }
          $assets += @('packages/SHA256SUMS.txt', 'packages/build-info.json')
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release 附件上传失败' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest --title ('知枝 ' + $tag) --notes-file 'packages/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Release 发布失败' }
